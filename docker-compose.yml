services:
  api1: &api
    build: .
    image: rinha-2026-go-api:latest
    networks:
      - rinha
    # Per-replica budget. The reference dataset is shipped as a 42 MB
    # mmap'd blob (uint8-quantized + packed fraud bitmap), so the Go heap
    # itself stays small and we bound it via GOMEMLIMIT below.
    environment:
      GOGC: "50"
      GOMEMLIMIT: "80MiB"
      GOMAXPROCS: "1"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"

  api2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
